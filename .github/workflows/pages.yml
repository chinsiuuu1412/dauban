name: GitHub Pages

on:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build static export for Pages
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url = new URL(process.env.NEXT_PUBLIC_SITE_URL);
          const expectedPath = process.env.NEXT_PUBLIC_BASE_PATH ?? '';
          if (url.protocol !== 'https:' || url.pathname.replace(/\/$/, '') !== expectedPath) {
            throw new Error('Pages URL must use HTTPS and match the configured base path.');
          }
          JS
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Verify exported pages and images
        shell: bash
        run: |
          for route in . trang-chu san-pham ve-chung-toi gio-hang dat-hang; do
            test -s "out/$route/index.html" || { echo "Missing page: $route"; exit 1; }
          done
          for slug in hop-qua ca-phe hat-dieu mac-ca; do
            test -s "out/san-pham/$slug/index.html" || { echo "Missing product page: $slug"; exit 1; }
            test -s "out/images/$slug.jpg" || { echo "Missing product image: $slug"; exit 1; }
          done
          test -s out/images/nong-dan.jpg || { echo "Missing harvest image"; exit 1; }
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
